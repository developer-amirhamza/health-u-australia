   PART 4c — WORD (.docx) RENDERER
   Writes real OOXML into a stored (uncompressed) ZIP — no external libraries.
   ========================================================================== */
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n;
  for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }

function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  files.forEach(f=>{
    const nb = enc.encode(f.name);
    const data = (typeof f.data === "string") ? enc.encode(f.data) : f.data;
    const crc = crc32(data), size = data.length;
    const lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true); lv.setUint16(10,0,true); lv.setUint16(12,0x21,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,size,true); lv.setUint32(22,size,true);
    lv.setUint16(26,nb.length,true); lv.setUint16(28,0,true); lh.set(nb,30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + nb.length), cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,size,true); cv.setUint32(24,size,true);
    cv.setUint16(28,nb.length,true); cv.setUint32(42,offset,true); ch.set(nb,46);
    central.push(ch);
    offset += lh.length + size;
  });
  const cdSize = central.reduce((a,c)=>a+c.length,0);
  const eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  const total = parts.reduce((a,c)=>a+c.length,0) + cdSize + 22;
  const out = new Uint8Array(total); let p=0;
  parts.forEach(c=>{ out.set(c,p); p+=c.length; });
  central.forEach(c=>{ out.set(c,p); p+=c.length; });
  out.set(eocd,p);
  return out;
}

const xe = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
function wRuns(text, opt){
  opt = opt||{};
  return splitPh(text).map(s=>{
    const rpr = [];
    if(opt.b) rpr.push("<w:b/>");
    if(opt.sz) rpr.push(`<w:sz w:val="${opt.sz}"/>`);
    if(opt.color) rpr.push(`<w:color w:val="${opt.color}"/>`);
    if(opt.caps) rpr.push("<w:caps/>");
    if(opt.u) rpr.push("<w:u w:val=\"single\"/>");
    if(s.ph){ rpr.push("<w:i/>","<w:color w:val=\"B4531F\"/>"); }
    return `<w:r>${rpr.length?`<w:rPr>${rpr.join("")}</w:rPr>`:""}`
      + `<w:t xml:space="preserve">${xe(s.t)}</w:t></w:r>`;
  }).join("");
}
function wP(text, opt){
  opt = opt||{};
  const ppr = [];
  if(opt.align) ppr.push(`<w:jc w:val="${opt.align}"/>`);
  if(opt.ind) ppr.push(`<w:ind w:left="${opt.ind}"${opt.hang?` w:hanging="${opt.hang}"`:""}/>`);
  ppr.push(`<w:spacing w:before="${opt.before||0}" w:after="${opt.after==null?110:opt.after}" w:line="264" w:lineRule="auto"/>`);
  if(opt.brk) ppr.push(`<w:pageBreakBefore/>`);
  if(opt.border) ppr.push(`<w:pBdr><w:bottom w:val="single" w:sz="10" w:color="${opt.borderColor||"0D6B63"}"/></w:pBdr>`);
  return `<w:p><w:pPr>${ppr.join("")}</w:pPr>${text==null?"":wRuns(text,opt)}</w:p>`;
}
function wCell(w, inner, shd){
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>`
    + (shd?`<w:shd w:val="clear" w:fill="${shd}"/>`:"")
    + `<w:tcMar><w:top w:w="70" w:type="dxa"/><w:bottom w:w="70" w:type="dxa"/>`
    + `<w:left w:w="90" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tcMar>`
    + `</w:tcPr>${inner || wP("")}</w:tc>`;
}

    + `<w:spacing w:after="0"/></w:pPr>`
    + `<w:r><w:rPr><w:rFonts w:ascii="${WFONT}" w:hAnsi="${WFONT}"/><w:sz w:val="15"/><w:color w:val="7A8090"/></w:rPr>`
    + `<w:t xml:space="preserve">${xe(foot?foot.left:"")}\t${xe(COMPANY.name)}</w:t></w:r></w:p></w:ftr>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<w:styles ${NS}><w:docDefaults><w:rPrDefault><w:rPr>`
    + `<w:rFonts w:ascii="${WFONT}" w:hAnsi="${WFONT}" w:cs="${WFONT}"/><w:sz w:val="${WBASE}"/><w:szCs w:val="${WBASE}"/>`
    + `</w:rPr></w:rPrDefault><w:pPrDefault><w:pPr>`
    + `<w:spacing w:after="110" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>`
    + `<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;

  const rels = [
    `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`,
    `<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>`
  ];
  const files = [
    {name:"[Content_Types].xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
      + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
      + `<Default Extension="xml" ContentType="application/xml"/>`
      + `<Default Extension="png" ContentType="image/png"/><Default Extension="jpg" ContentType="image/jpeg"/>`
      + `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>`
      + `<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>`
      + `<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>`
      + `</Types>`},
    {name:"_rels/.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>`
      + `</Relationships>`}
  ];
  if(hasLogo){
    const m = /^data:image\/(png|jpe?g);base64,(.+)$/i.exec(state.logo);
    if(m){
      const bin = atob(m[2]); const u8 = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
      const ext = m[1].toLowerCase().startsWith("p") ? "png" : "jpg";
      files.push({name:`word/media/logo.${ext}`, data:u8});
      rels.push(`<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.${ext}"/>`);
    }
  }
  files.push(
    {name:"word/_rels/document.xml.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join("")}</Relationships>`},
    {name:"word/document.xml", data:documentXml},
    {name:"word/styles.xml", data:stylesXml},
    {name:"word/footer1.xml", data:footerXml}
  );
  return zipStore(files);
}

const openSecs = {};

function renderForm(){
  const secs = schema();
  const html = [];

  html.push(`<div class="type-row">` + Object.entries(TYPES).map(([k,v])=>
    `<button class="type-card" data-type="${k}" aria-pressed="${state.type===k}">`
    + `<b>${v.label}</b><span>${v.blurb}</span></button>`).join("") + `</div>`);

  secs.forEach(sec=>{
    if(openSecs[sec.n] === undefined) openSecs[sec.n] = sec.open;
    html.push(`<div class="sec" data-open="${openSecs[sec.n]}" data-sec="${sec.n}">`
      + `<button class="sec-h" type="button"><span class="sec-n">${sec.n}</span>`
      + `<span class="sec-t">${esc(sec.t)}<span class="sec-sub">${esc(sec.sub)}</span></span>`
      + `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`
      + `</button><div class="sec-b"><div class="grid">`
      + sec.fields.map(fieldHTML).join("")
      + `</div><div class="sec-extra">${secExtra(sec.n)}</div></div></div>`);
  });
  $("#formInner").innerHTML = html.join("");
  wireForm();
}

function fieldHTML(f){
  let v = state.data[f.k] == null ? "" : state.data[f.k];
  const cls = "f" + (f.wide ? " wide" : "");
  const lab = `<label for="fld_${f.k}">${f.l}${f.req?' <span class="req">*</span>':""}</label>`;
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : "";
  let ctl;
  if(f.type === "textarea"){
    ctl = `<textarea id="fld_${f.k}" data-k="${f.k}" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`;
  } else if(f.type === "select"){
    let opts = f.opts;
    if(f.dyn === "payPoint"){
      const n = payPointsFor(state.data.level) || 1;
      opts = Array.from({length:n}, (_,i)=>({v:String(i+1), t:"Pay point "+(i+1)}));
    }
    if(f.dyn === "incChoice"){
      opts = [{ v:"", t:"None — Award rates only" }];
      incTiers(state.data.level, +state.data.payPoint).forEach(t=>{
        opts.push({ v:t.code, t:"Pay point " + t.code + "  —  " + money(t.casualHourly) + " / hour casual" });
      });
    }
    if(f.dyn === "classCode"){
      opts = [];
      Object.keys(state.award.weekly).forEach(L=>{
        state.award.weekly[L].forEach((wk,i)=>{
          const pp = i + 1, hr = r2(wk / state.award.hoursPerWeek);
          opts.push({ v:L+"."+pp,
                      t:classLabel(L,pp)+"   ("+L+"."+pp+")   \u2014   "+money(hr)+" / hour" });
        });
      });
      v = state.data.level + "." + state.data.payPoint;
    }
    ctl = `<select id="fld_${f.k}" data-k="${f.k}">` + opts.map(o=>
      `<option value="${esc(o.v)}"${String(v)===String(o.v)?" selected":""}>${esc(o.t)}</option>`).join("") + `</select>`;
  } else if(f.money){
    ctl = `<div class="pfx"><span>$</span><input id="fld_${f.k}" data-k="${f.k}" type="number" step="${f.step||"0.01"}" value="${esc(v)}" placeholder="${esc(f.ph||"")}"></div>`;
  } else {
    ctl = `<input id="fld_${f.k}" data-k="${f.k}" type="${f.type||"text"}"${f.step?` step="${f.step}"`:""} value="${esc(v)}" placeholder="${esc(f.ph||"")}">`;
  }
  return `<div class="${cls}">${lab}${ctl}${hint}</div>`;
}

function secExtra(n){
  if(n === 1){
    return `<div class="grid" style="margin-top:14px">
      <div class="f">
        <label>Document font</label>
        <select id="styFam">${Object.keys(FAMILIES).map(k=>
          `<option value="${k}"${state.style.family===k?" selected":""}>${esc(FAMILIES[k].label)}</option>`).join("")}</select>
        <div class="hint">Applies to the preview, the PDF and the Word file</div>
      </div>
      <div class="f">
        <label>Body text size</label>
        <select id="stySize">${[9.5,10,10.5,11,11.5,12].map(v=>
          `<option value="${v}"${(+state.style.size)===v?" selected":""}>${v} pt</option>`).join("")}</select>
        <div class="hint">Headings and table text scale with this</div>
      </div>
    </div>
    <div class="note note-info" style="align-items:center">
      ${state.logo
        ? `<img src="${state.logo}" alt="" style="height:34px;width:auto;flex:0 0 auto">`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 17l5-5 4 4 3-2 4 3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
      <div style="flex:1">${state.logo
        ? (state.logoIsDefault
            ? `<b>Health U logo.</b> Appears at the top of page 1 in the PDF and the Word file.`
            : `<b>Custom logo in use.</b> Appears at the top of page 1 in the PDF and the Word file.`)
        : `<b>No letterhead logo.</b> Contracts will show the company name only.`}</div>
      <button class="btn btn-sm" id="btnLogo" type="button">${state.logo?"Replace":"Upload"}</button>
      ${state.logo
        ? `<button class="btn btn-sm" id="btnLogoX" type="button">Remove</button>`
        : `<button class="btn btn-sm" id="btnLogoR" type="button">Restore Health U logo</button>`}
    </div>`;
  }
  if(n !== 4) return "";
  if(state.type === "contractor"){
    return `<div class="note note-warn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01" stroke-linecap="round"/></svg>
      <div><b>Award rates don't apply to contractors</b> — the fee is whatever is agreed here. Two things worth remembering:
      super can still be payable where the contract is wholly or principally for the person's labour, and an engagement that
      looks and operates like employment can be treated as employment regardless of what the paperwork says.</div>
    </div>`;
  }
  const R = currentRates();
  if(!R) return `<div class="note note-warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01" stroke-linecap="round"/></svg><div>No rate found for that level and pay point. Check the <b>Rate table</b> tab.</div></div>`;
  const casual = state.type === "casual";
  const rows = [["Weekday", R.weekday],["Saturday", R.saturday],["Sunday", R.sunday],
                ["Public holiday", R.publicHoliday],["Afternoon shift", R.afternoon],["Night shift", R.night],
                ["Overtime — first 2 hrs", R.otFirst2],["Overtime — after 2 hrs", R.otAfter2]];
  const INC = incentiveInfo();
  const SEL = incSel();   // tiers are casual-only, so SEL.code is empty on permanent types
  return `<div class="rates">
    <div class="rates-h">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      ${SEL.code
          ? "Level " + state.data.level + " - pay point " + SEL.code + " (with incentive)"
          : classLabel(state.data.level, state.data.payPoint)} — ${casual?"casual":"permanent"} rates
      <span class="eff">effective ${esc(state.award.effectiveFrom)}</span>
    </div>
    <table class="rt">
      <thead><tr><th>Shift</th><th>Base rate</th><th>+ super (${R.superPct}%)</th></tr></thead>
      <tbody>${rows.map(([l,v])=>
        `<tr><td>${l}</td><td class="num">${money(v.base)}</td><td class="num tot">${money(v.incSuper)}</td></tr>`).join("")}
      </tbody>
    </table>
  </div>
  <div class="note note-info">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01" stroke-linecap="round"/></svg>
    <div>Ordinary rate <b>${money(R.hourly)}/hr</b> · ${money0(R.weekly)}/week · ${money0(R.annual)}/year (38 hrs).
    From the ${esc(state.award.scheduleName)}.</div>
  </div>` + (INC ? incentiveNote(INC) : "");
}

function incentiveNote(INC){
  if(INC.total == null) return `<div class="note note-warn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01" stroke-linecap="round"/></svg>
    <div>Enter the weekday rate actually paid so the incentive loading can be worked out.</div></div>`;
  const under = INC.loading < 0;
  const src = INC.code ? `Pay point ${INC.code}` : "Entered rate";
  return `<div class="note ${under?"note-warn":"note-ok"}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01" stroke-linecap="round"/></svg>
    <div>${under
      ? `<b>${money(INC.total)} is below the Award weekday rate of ${money(INC.award)}.</b> An incentive loading can only
         sit above the Award minimum — check the rate before issuing this contract.`
      : `${esc(src)}: incentive loading <b>${money(INC.loading)}/hr</b> on the weekday rate — ${money(INC.award)}
         Award + ${money(INC.loading)} = <b>${money(INC.total)}/hr</b>. Every other rate above is lifted in step.
         The letter shows the rates only, never the pay point they came from.`}</div>
  </div>`;
}

function wireForm(){
  const sf = $("#styFam"); if(sf) sf.onchange = ()=>{ state.style.family = sf.value; renderPreview(); };
  const ss = $("#stySize"); if(ss) ss.onchange = ()=>{ state.style.size = parseFloat(ss.value); renderPreview(); };
  const bl = $("#btnLogo"); if(bl) bl.onclick = ()=> $("#fileLogo").click();
  const bx = $("#btnLogoX"); if(bx) bx.onclick = ()=>{
    state.logo = null; state.logoPdf = null; state.logoW = state.logoH = 0; state.logoIsDefault = false;
    renderForm(); renderPreview(); toast("Logo removed");
  };
  const br = $("#btnLogoR"); if(br) br.onclick = ()=>{
    state.logo = HU_LOGO_PNG; state.logoW = HU_LOGO_W; state.logoH = HU_LOGO_H;
    state.logoPdf = { kind:"indexed", b64: HU_LOGO_RGB, pal: HU_LOGO_PAL, w: HU_LOGO_W, h: HU_LOGO_H };
    state.logoIsDefault = true;
    renderForm(); renderPreview(); toast("Health U logo restored", "ok");
  };
  $$(".type-card").forEach(b=> b.onclick = ()=>{
    state.type = b.dataset.type;
    const d = state.data;
    if(state.type === "casual"){ d.probationMonths = "1"; d.noticePeriod = "1 month"; }
    else if(state.type === "contractor"){ if(!d.noticePeriod || d.noticePeriod === "1 month") d.noticePeriod = "2 weeks"; }
    else if(d.probationMonths === "1") d.probationMonths = "6";
    renderForm(); renderPreview();
  });
  $$(".sec-h").forEach(h=> h.onclick = ()=>{
    const sec = h.closest(".sec"), n = sec.dataset.sec;
    openSecs[n] = sec.dataset.open !== "true";
    sec.dataset.open = openSecs[n];
  });
  $$("[data-k]").forEach(el=>{
    const ev = (el.tagName==="SELECT") ? "change" : "input";
    el.addEventListener(ev, ()=>{
      if(el.dataset.k === "classCode"){   // one control drives level and pay point
        const m = String(el.value).match(/^(\d+)\.(\d+)$/);
        if(m){
          state.data.level = m[1];
          state.data.payPoint = m[2];
          // a tier belongs to one classification, so drop it if this one has no such tier
          const c = state.data.incChoice;
          if(c && !incTier(m[1], +m[2], c)) state.data.incChoice = "";
        }
        renderForm(); renderPreview();
        return;
      }
      state.data[el.dataset.k] = el.value;
      if(el.dataset.k === "level"){
        const n = payPointsFor(el.value);
        if(+state.data.payPoint > n) state.data.payPoint = "1";
        renderForm();
      } else if(el.dataset.k === "ftBasis" || el.dataset.k === "incChoice"){
        renderForm();          // these change which fields are shown
      } else if(["payPoint","superRate"].includes(el.dataset.k)){
        // replace only the derived rate readout, so focus stays in the field
        const box = $(".sec[data-sec='4'] .sec-extra");
        if(box) box.innerHTML = secExtra(4);
      }
      renderPreview();
    });
  });
}

/* The built-in PDF fonts cover WinAnsi only. Names with Vietnamese, Arabic,
   Chinese or similar characters need the browser's own PDF export instead. */
function unsupportedChars(){
  const set = new Set();
  Object.keys(state.data).forEach(k=>{
    for(const ch of String(state.data[k]||"")){
      const cp = ch.codePointAt(0);
      if(cp > 255 && !WA_MAP[cp]) set.add(ch);
    }
  });
  return Array.from(set);
}

function renderPreview(){
  const blocks = buildDoc();
  const html = renderHTML(blocks);
  const fam = FAM().css, fsz = (state.style.size || 10.5) + "pt";
  ["#docPreview", "#docPrint"].forEach(sel=>{
    const el = $(sel);
    el.innerHTML = html;
    el.style.fontFamily = fam;
    el.style.fontSize = fsz;
  });
  $("#prevType").textContent = TYPES[state.type].label;
  $("#prevName").textContent = state.data.fullName ? state.data.fullName : "Live preview";
  const uni = unsupportedChars();
  const ubar = $("#uniBar");
  if(uni.length){
    ubar.style.display = "flex";
    $("#uniTxt").innerHTML = `The characters <b>${uni.slice(0,8).map(esc).join(" ")}</b> can't be drawn by the built-in `
      + `PDF fonts. <b>Download PDF</b> will switch to your browser's own “Save as PDF”, which keeps them intact. `
      + `The Word file is unaffected.`;
  } else ubar.style.display = "none";

  const miss = requiredMissing();
  const bar = $("#missingBar");
  if(miss.length){
    bar.style.display = "flex";
    $("#missingTxt").innerHTML = `<b>${miss.length}</b> field${miss.length>1?"s":""} still to fill: ${miss.slice(0,4).map(esc).join(", ")}${miss.length>4?` +${miss.length-4} more`:""}`;
    $("#prevWarn").innerHTML = `<span class="pill" style="color:#8a6100;background:#fdf4de;border-color:#f0e0b4">${miss.length} to fill</span>`;
  } else {
    bar.style.display = "none";
    $("#prevWarn").innerHTML = `<span class="pill" style="color:#1d7a4c;background:#e7f5ee;border-color:#c3e6d3">Ready</span>`;
  }
}

/* ==========================================================================
   PART 5b — IMPORT FROM A COMPLETED INTAKE FORM
   Reads pasted "Label: value" text and maps it onto the form fields.
   Label matching is synonym-based so it survives wording changes.
   ========================================================================== */
const NORM = s => String(s||"").toLowerCase()
  .replace(/[*_#•>–—]/g," ").replace(/[^a-z0-9 /]/g," ")
  .replace(/\s+/g," ").trim();

const SYN = {
  fullName:      ["full name","name","employee name","staff name","applicant name","legal name","worker name","contractor name","full legal name"],
  _first:        ["first name","given name","given names","firstname","preferred first name"],
  _last:         ["last name","surname","family name","lastname"],
  addrLine1:     ["address","street address","residential address","home address","address line 1","street","postal address"],
  _suburb:       ["suburb","city","town","suburb/town","suburb town"],
  _stateAu:      ["state","state/territory","state territory"],
  _postcode:     ["postcode","post code","zip","zip code"],
  addrLine2:     ["address line 2","suburb state postcode"],
  positionTitle: ["position","position title","role","job title","job role","position applied for","engaged as","occupation"],
  startDate:     ["start date","commencement date","date of commencement","employment start date","first day","proposed start date"],
  endDate:       ["end date","finish date","contract end date","completion date"],
  location:      ["location","work location","site","base location","location on appointment"],
  payFrequency:  ["pay frequency","payment frequency","pay cycle"],
  level:         ["level","classification level","award level","schads level","classification"],
  payPoint:      ["pay point","paypoint"],
  cABN:          ["abn","australian business number"],
  cEntity:       ["entity","trading name","business name","company name","entity name"],
  reportingTo:   ["reporting to","reports to","manager","supervisor","line manager"],
  ptHours:       ["guaranteed hours","contracted hours","hours per week","weekly hours"]
};

function parseIntake(text){
  const raw = String(text||"").replace(/\r/g,"").split("\n");
  const map = {};
  // values can arrive wrapped in markdown or list decoration — strip it, keep the content
  const clean = v => String(v||"").trim()
    .replace(/^[\s*_#>•–—-]+/, "")
    .replace(/[\s*_]+$/, "")
    .trim();
  const put = (k,v)=>{ k = NORM(k); v = clean(v);
    if(k && v && v !== "-" && !/^n\/?a$/i.test(v) && !map[k]) map[k] = v; };

  for(let i=0;i<raw.length;i++){
    const line = raw[i].trim();
    if(!line) continue;
    const m = line.match(/^([^:\t]{2,60})[:\t]\s*(.*)$/);
    if(m){
      if(m[2].trim()) put(m[1], m[2]);
      else {                                   // label on its own line, value beneath
        let j = i+1;
        while(j < raw.length && !raw[j].trim()) j++;
        if(j < raw.length && !/[:\t]/.test(raw[j])){ put(m[1], raw[j]); i = j; }
      }
    } else {
      const nxt = (raw[i+1]||"").trim();       // label line with no colon at all
      const isLabel = Object.keys(SYN).some(k => SYN[k].indexOf(NORM(line)) >= 0);
      if(isLabel && nxt && !/[:\t]/.test(nxt)){ put(line, nxt); i++; }
    }
  }

  const pick = key => { const l = SYN[key]||[]; for(let i=0;i<l.length;i++) if(map[l[i]]) return map[l[i]]; return ""; };
  const out = {};
  Object.keys(SYN).filter(k => k[0] !== "_").forEach(k=>{ const v = pick(k); if(v) out[k] = v; });

  const first = pick("_first"), last = pick("_last");
  if(first && last) out.fullName = (first + " " + last).trim();
  else if(!out.fullName && (first || last)) out.fullName = (first || last);

  if(!out.addrLine2){
    const parts = [pick("_suburb"), pick("_stateAu"), pick("_postcode")].filter(Boolean);
    if(parts.length) out.addrLine2 = parts.join(" ").replace(/\s+/g," ").trim();
  }
  if(out.addrLine1 && !out.addrLine2){       // one-line address containing a postcode
    const m = out.addrLine1.match(/^(.*?),?\s*([A-Za-z' ]+\s+(?:NSW|VIC|QLD|SA|WA|TAS|NT|ACT)\s+\d{4})$/i);
    if(m){ out.addrLine1 = m[1].replace(/,\s*$/,"").trim(); out.addrLine2 = m[2].trim(); }
  }

  ["startDate","endDate"].forEach(k=>{ if(out[k]){ const iso = toISO(out[k]); if(iso) out[k] = iso; else delete out[k]; } });
  if(out.level){ const n = out.level.match(/(\d)/); out.level = n ? n[1] : ""; if(!out.level || !state.award.weekly[out.level]) delete out.level; }
  if(out.payPoint){ const n = out.payPoint.match(/(\d)/); if(n) out.payPoint = n[1]; else delete out.payPoint; }
  if(out.ptHours){ const n = out.ptHours.match(/(\d+(?:\.\d+)?)/); if(n) out.ptHours = n[1]; else delete out.ptHours; }
  return out;
}

const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function toISO(s){
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);      // Australian day-first
  if(m){ let y = +m[3]; if(y < 100) y += 2000;
    return `${y}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`; }
  m = s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?,?\s+(\d{4})$/);
  if(m && MON[m[2].slice(0,3).toLowerCase()])
    return `${m[3]}-${String(MON[m[2].slice(0,3).toLowerCase()]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`;
  m = s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})$/);
  if(m && MON[m[1].slice(0,3).toLowerCase()])
    return `${m[3]}-${String(MON[m[1].slice(0,3).toLowerCase()]).padStart(2,"0")}-${String(+m[2]).padStart(2,"0")}`;
  return "";
}

const FIELD_LABEL = {
  fullName:"Full name", addrLine1:"Address line 1", addrLine2:"Suburb, state, postcode",
  positionTitle:"Position title", startDate:"Start date", endDate:"End date",

};

/* ==========================================================================
   PART 5c — PDF READER
   Reads a completed intake form PDF without any external library.
   Two paths, tried in order:
     1. AcroForm — if the PDF has fillable fields, read field names and values
        directly. This is exact.
     2. Page text — otherwise pull the text out of the content streams,
        decoding through /ToUnicode or /Encoding so subset fonts come out right.
   Whatever comes back is handed to the same label matcher the paste box uses.
   ========================================================================== */

function L1(u8){
  let s = "", CH = 0x8000;
  for(let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return s;
}

async function inflate(u8){
  if(typeof DecompressionStream === "undefined") return null;
  for(const fmt of ["deflate", "deflate-raw"]){
    try{
      const ab = await new Response(
        new Blob([u8]).stream().pipeThrough(new DecompressionStream(fmt))
      ).arrayBuffer();
      const out = new Uint8Array(ab);
      if(out.length) return out;
    }catch(e){ /* try the next format */ }
  }
  return null;
}

/* ---- PDF string / name primitives ------------------------------------- */
function pdfLiteral(src, i){            // src[i] === "(" ; returns [text, nextIndex]
  let depth = 1, out = "";
  i++;
  while(i < src.length && depth > 0){
    const c = src[i];
    if(c === "\\"){
      const n = src[i + 1];
      const simple = { n:"\n", r:"\r", t:"\t", b:"\b", f:"\f", "(":"(", ")":")", "\\":"\\" };
      if(simple[n] !== undefined){ out += simple[n]; i += 2; }
      else if(/[0-7]/.test(n)){
        let oct = "";
        let j = i + 1;
        while(j < src.length && oct.length < 3 && /[0-7]/.test(src[j])) oct += src[j++];
        out += String.fromCharCode(parseInt(oct, 8)); i = j;
      }
      else if(n === "\n"){ i += 2; }
      else { out += n; i += 2; }
    } else if(c === "("){ depth++; out += c; i++; }
    else if(c === ")"){ depth--; if(depth) out += c; i++; }
    else { out += c; i++; }
  }
  return [out, i];
}
function pdfHex(src, i){                // src[i] === "<"
  let j = src.indexOf(">", i);
  if(j < 0) j = src.length;
  const hex = src.slice(i + 1, j).replace(/[^0-9a-fA-F]/g, "");
  let out = "";
  for(let k = 0; k + 1 < hex.length; k += 2) out += String.fromCharCode(parseInt(hex.substr(k, 2), 16));
  return [out, j + 1];
}
function decodeText(raw){               // handle UTF-16BE strings
  if(raw.length > 1 && raw.charCodeAt(0) === 0xFE && raw.charCodeAt(1) === 0xFF){
    let out = "";
    for(let i = 2; i + 1 < raw.length; i += 2) out += String.fromCharCode((raw.charCodeAt(i) << 8) | raw.charCodeAt(i + 1));
    return out;
  }
  return raw;
}

/* ---- object table ------------------------------------------------------ */
async function pdfObjects(bytes){
  const s = L1(bytes), objs = {};
  const re = /(\d+)\s+\d+\s+obj\b/g;
  let m;
  while((m = re.exec(s))){
    const num = +m[1], start = m.index + m[0].length;
    const end = s.indexOf("endobj", start);
    if(end < 0){ break; }
    // Only the dictionary is sliced — object bodies can be megabytes of image data.
    const body = s.slice(start, Math.min(end, start + 6000));
    const si = body.search(/\bstream\r?\n?/);
    let dict = body, data = null;
    if(si >= 0){
      dict = body.slice(0, si);
      const sm = body.slice(si).match(/\bstream(\r\n|\r|\n)/);
      if(sm){
        const ds = start + si + sm[0].length;
        let de = -1;
        const lm = dict.match(/\/Length\s+(\d+)(?!\s+\d+\s+R)/);
        if(lm){
          const cand = ds + (+lm[1]);
          if(s.slice(cand, cand + 24).indexOf("endstream") >= 0) de = cand;
        }
        if(de < 0){
          de = s.indexOf("endstream", ds);
          if(de > ds && s[de - 1] === "\n") de--;
          if(de > ds && s[de - 1] === "\r") de--;
        }
        if(de > ds) data = bytes.subarray(ds, de);
      }
    }
    objs[num] = { dict, data };
    re.lastIndex = end;
  }

  // expand compressed object streams so their dictionaries are visible too
  for(const num of Object.keys(objs)){
    const o = objs[num];
    if(!o.data || !/\/Type\s*\/ObjStm/.test(o.dict)) continue;
    const raw = /\/FlateDecode/.test(o.dict) ? await inflate(o.data) : o.data;
    if(!raw) continue;
    const txt = L1(raw);
    const N = +(o.dict.match(/\/N\s+(\d+)/) || [])[1];
    const first = +(o.dict.match(/\/First\s+(\d+)/) || [])[1];
    if(!N || isNaN(first)) continue;
    const head = txt.slice(0, first).trim().split(/\s+/).map(Number);
    for(let i = 0; i < N; i++){
      const onum = head[i * 2], off = head[i * 2 + 1];
      if(onum == null || off == null) continue;
      const nextOff = (i + 1 < N) ? head[i * 2 + 3] : (txt.length - first);
      if(!objs[onum]) objs[onum] = { dict: txt.slice(first + off, first + nextOff), data: null };
    }
  }
  return objs;
}

async function streamOf(o){
  if(!o || !o.data) return null;
  if(/\/FlateDecode/.test(o.dict)) return await inflate(o.data);
  if(/\/Filter/.test(o.dict) && !/\/FlateDecode/.test(o.dict)) return null;   // unsupported filter
  return o.data;
}

/* ---- path 1: fillable form fields -------------------------------------- */
function acroFields(objs){
  const out = [];
  Object.keys(objs).forEach(n => {
    const d = objs[n].dict;
    if(d.indexOf("/T") < 0 || d.indexOf("/V") < 0) return;
    const t = readKeyString(d, "T"), v = readKeyString(d, "V");
    if(t && v != null && String(v).trim()) out.push([t, v]);
  });
  return out;
}
function readKeyString(dict, key){
  const re = new RegExp("/" + key + "\\s*(\\(|<|/)");
  const m = dict.match(re);
  if(!m) return null;
  const i = m.index + m[0].length - 1;
  if(dict[i] === "(") return decodeText(pdfLiteral(dict, i)[0]);
  if(dict[i] === "<" && dict[i + 1] !== "<") return decodeText(pdfHex(dict, i)[0]);
  if(dict[i] === "/"){
    const nm = dict.slice(i + 1).match(/^[^\s/\[\]<>()]+/);
    return nm ? nm[0].replace(/#([0-9a-fA-F]{2})/g, (x, h) => String.fromCharCode(parseInt(h, 16))) : null;
  }
  return null;
}

/* ---- path 2: page text ------------------------------------------------- */
const STD_DIFF_HINT = /\/Differences\s*\[([\s\S]*?)\]/;

/* Balanced-bracket slice, so nested /W arrays survive. */
function bracketBody(s, from){
  const i = s.indexOf("[", from);
  if(i < 0) return "";
  let depth = 0;
  for(let j = i; j < s.length; j++){
    if(s[j] === "[") depth++;
    else if(s[j] === "]"){ depth--; if(!depth) return s.slice(i + 1, j); }
  }
  return "";
}
/* /W  =>  [ c [w w w] cFirst cLast w ]  — glyph advance in 1/1000 em */
function parseW(body){
  const map = {};
  const toks = body.match(/\[[^\]]*\]|-?[\d.]+/g) || [];
  let i = 0;
  while(i < toks.length){
    const a = toks[i];
    if(a[0] === "[") { i++; continue; }
    const c = parseFloat(a), nxt = toks[i + 1];
    if(nxt && nxt[0] === "["){
      const ws = (nxt.match(/-?[\d.]+/g) || []).map(Number);
      ws.forEach((w, k) => { map[c + k] = w; });
      i += 2;
    } else if(nxt != null && toks[i + 2] != null){
      const hi = parseFloat(nxt), w = parseFloat(toks[i + 2]);
      if(hi - c < 65536) for(let k = c; k <= hi; k++) map[k] = w;
      i += 3;
    } else i++;
  }
  return map;
}

async function fontDecoders(objs){
  // object number -> { decode(codes) => text, width(codes) => 1/1000 em }
  const dec = {};
  for(const n of Object.keys(objs)){
    const d = objs[n].dict;
    if(!/\/Type\s*\/Font/.test(d)) continue;
    let toUni = null;
    const tu = d.match(/\/ToUnicode\s+(\d+)\s+\d+\s+R/);
    if(tu && objs[tu[1]]){
      const raw = await streamOf(objs[tu[1]]);
      if(raw) toUni = parseCMap(L1(raw));
    }
    let diff = null;
    const em = d.match(/\/Encoding\s+(\d+)\s+\d+\s+R/);
    const encDict = em && objs[em[1]] ? objs[em[1]].dict : d;
    const dm = encDict.match(STD_DIFF_HINT);
    if(dm) diff = parseDifferences(dm[1]);
    const twoByte = /\/Type0|\/Identity-H/.test(d);

    // advance widths
    let widths = {}, dw = twoByte ? 1000 : 500, first = 0;
    if(twoByte){
      let dd = null;
      const dfm = d.match(/\/DescendantFonts\s*\[\s*(\d+)\s+\d+\s+R/);
      if(dfm && objs[dfm[1]]) dd = objs[dfm[1]].dict;
      else { const inl = d.match(/\/DescendantFonts\s*\[([\s\S]*?)\]\s*(?:\/|>>)/); dd = inl ? inl[1] : null; }
      if(dd){
        const dwm = dd.match(/\/DW\s+(-?[\d.]+)/);
        if(dwm) dw = parseFloat(dwm[1]);
        const wi = dd.indexOf("/W");
        if(wi >= 0) widths = parseW(bracketBody(dd, wi));
      }
    } else {
      const fc = d.match(/\/FirstChar\s+(\d+)/);
      first = fc ? +fc[1] : 0;
      const wi = d.indexOf("/Widths");
      if(wi >= 0){
        let wb = bracketBody(d, wi);
        if(!wb){
          const wr = d.match(/\/Widths\s+(\d+)\s+\d+\s+R/);
          if(wr && objs[wr[1]]) wb = bracketBody(objs[wr[1]].dict, 0);
        }
        (wb.match(/-?[\d.]+/g) || []).forEach((w, k) => { widths[first + k] = parseFloat(w); });
      }
    }

    dec[n] = {
      decode: makeDecoder(toUni, diff, twoByte),
      width: raw => {
        let total = 0;
        if(twoByte){
          for(let i = 0; i + 1 < raw.length; i += 2){
            const c = (raw.charCodeAt(i) << 8) | raw.charCodeAt(i + 1);
            total += (widths[c] != null ? widths[c] : dw);
          }
        } else {
          for(let i = 0; i < raw.length; i++){
            const c = raw.charCodeAt(i);
            total += (widths[c] != null ? widths[c] : dw);
          }
        }
        return total;
      }
    };
  }
  return dec;
}
function makeDecoder(toUni, diff, twoByte){
  return function(raw){
    let out = "";
    if(twoByte){
      for(let i = 0; i + 1 < raw.length; i += 2){
        const code = (raw.charCodeAt(i) << 8) | raw.charCodeAt(i + 1);
        out += (toUni && toUni[code] != null) ? toUni[code] : "";
      }
      return out;
    }
    for(let i = 0; i < raw.length; i++){
      const c = raw.charCodeAt(i);
      if(toUni && toUni[c] != null) out += toUni[c];
      else if(diff && diff[c] != null) out += diff[c];
      else out += String.fromCharCode(c);
    }
    return out;
  };
}
function parseCMap(txt){
  const map = {};
  const hx = h => parseInt(h, 16);
  const uni = h => {                       // hex string -> characters (UTF-16BE)
    let s = "";
    for(let i = 0; i + 3 < h.length + 1; i += 4) s += String.fromCharCode(hx(h.substr(i, 4)));
    return s;
  };
  let re = /beginbfchar([\s\S]*?)endbfchar/g, m;
  while((m = re.exec(txt))){
    const pairs = m[1].match(/<([0-9a-fA-F]+)>\s*<([0-9a-fA-F]+)>/g) || [];
    pairs.forEach(p => {
      const g = p.match(/<([0-9a-fA-F]+)>\s*<([0-9a-fA-F]+)>/);
      map[hx(g[1])] = uni(g[2]);
    });
  }
  re = /beginbfrange([\s\S]*?)endbfrange/g;
  while((m = re.exec(txt))){
    const body = m[1];
    const simple = body.match(/<([0-9a-fA-F]+)>\s*<([0-9a-fA-F]+)>\s*<([0-9a-fA-F]+)>/g) || [];
    simple.forEach(p => {
      const g = p.match(/<([0-9a-fA-F]+)>\s*<([0-9a-fA-F]+)>\s*<([0-9a-fA-F]+)>/);
      const lo = hx(g[1]), hi = hx(g[2]), base = hx(g[3]);
      for(let c = lo; c <= hi && c - lo < 512; c++) map[c] = String.fromCharCode(base + (c - lo));
    });
    const arr = body.match(/<([0-9a-fA-F]+)>\s*<([0-9a-fA-F]+)>\s*\[([\s\S]*?)\]/g) || [];
    arr.forEach(p => {
      const g = p.match(/<([0-9a-fA-F]+)>\s*<([0-9a-fA-F]+)>\s*\[([\s\S]*?)\]/);
      const lo = hx(g[1]);
      const items = g[3].match(/<([0-9a-fA-F]+)>/g) || [];
      items.forEach((it, k) => { map[lo + k] = uni(it.replace(/[<>]/g, "")); });
    });
  }
  return map;
}
const GLYPHS = { space:" ", hyphen:"-", period:".", comma:",", slash:"/", colon:":", semicolon:";",
  at:"@", numbersign:"#", ampersand:"&", parenleft:"(", parenright:")", quotesingle:"'",
  quoteright:"’", quoteleft:"‘", quotedblleft:"“", quotedblright:"”",
  endash:"–", emdash:"—", bullet:"•", apostrophe:"'", underscore:"_", plus:"+",
  equal:"=", asterisk:"*", question:"?", exclam:"!", dollar:"$", percent:"%" };
function parseDifferences(body){
  const map = {};
  const toks = body.match(/\d+|\/[^\s/\[\]<>()]+/g) || [];
  let code = 0;
  toks.forEach(t => {
    if(t[0] === "/"){
      const g = t.slice(1);
      if(GLYPHS[g]) map[code] = GLYPHS[g];
      else if(/^uni([0-9a-fA-F]{4})$/.test(g)) map[code] = String.fromCharCode(parseInt(g.slice(3), 16));
      else if(g.length === 1) map[code] = g;
      code++;
    } else code = +t;
  });
  return map;
}

/* Positioned text runs — keeps x/y so multi-column form layouts survive. */
function runsFromContent(src, fontByName, decoders){
  const runs = [];
  let dec = null, fsize = 10;
  let tm = [1, 0, 0, 1, 0, 0], tlm = [1, 0, 0, 1, 0, 0];
  // Graphics state matrix — wkhtmltopdf and friends flip the page with `cm`,
  // so text positions must be pushed through it or the page comes out upside down.
  let ctm = [1, 0, 0, 1, 0, 0];
  const gsStack = [];
  const mul = (m, n) => [
    m[0]*n[0] + m[1]*n[2],          m[0]*n[1] + m[1]*n[3],
    m[2]*n[0] + m[3]*n[2],          m[2]*n[1] + m[3]*n[3],
    m[4]*n[0] + m[5]*n[2] + n[4],   m[4]*n[1] + m[5]*n[3] + n[5]
  ];
  const stack = [];
  const strOf = e => (e && e.s != null) ? e.s : "";
  let leading = 0, i = 0;

  // decode a shown string and return its exact advance in text-space units
  const show = raw => {
    const txt = dec ? dec.decode(raw) : raw;
    const w = dec ? dec.width(raw) : raw.length * 500;
    return { txt: txt, adv: w / 1000 * fsize };
  };
  const emit = (txt, adv) => {
    if(txt){
      const m = mul(tm, ctm);
      const sc = Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])) || 1;
      runs.push({ x: m[4], y: m[5], end: m[4] + adv * sc, t: txt, size: Math.max(4, fsize * sc) });
    }
    tm[4] += adv;
  };
  const setLine = (tx, ty) => {
    tlm = [tlm[0], tlm[1], tlm[2], tlm[3], tlm[4] + tx * tlm[0] + ty * tlm[2], tlm[5] + tx * tlm[1] + ty * tlm[3]];
    tm = tlm.slice();
  };

  while(i < src.length){
    const c = src[i];
    if(c === "("){ const r = pdfLiteral(src, i); stack.push({ s: r[0] }); i = r[1]; continue; }
    if(c === "<" && src[i + 1] !== "<"){ const r = pdfHex(src, i); stack.push({ s: r[0] }); i = r[1]; continue; }
    if(c === "<" && src[i + 1] === "<"){ i += 2; continue; }
    if(c === ">" && src[i + 1] === ">"){ i += 2; continue; }
    if(c === "["){ stack.push({ arrStart: true }); i++; continue; }
    if(c === "]"){
      const items = [];
      while(stack.length && !stack[stack.length - 1].arrStart) items.unshift(stack.pop());
      stack.pop(); stack.push({ arr: items }); i++; continue;
    }
    if(c === "/"){
      const m = src.slice(i + 1).match(/^[^\s/\[\]<>(){}]+/);
      stack.push({ n: m ? m[0] : "" }); i += 1 + (m ? m[0].length : 0); continue;
    }
    if(/[-+.\d]/.test(c)){
      const m = src.slice(i).match(/^[-+.\d]+/);
      const v = parseFloat(m[0]); stack.push({ v: isNaN(v) ? 0 : v }); i += m[0].length; continue;
    }
    const om = src.slice(i).match(/^[A-Za-z'"*][A-Za-z0-9'"*]*/);
    if(!om){ i++; continue; }
    const o = om[0]; i += o.length;

    switch(o){
      case "Tf": {
        const nm = stack.length >= 2 ? stack[stack.length - 2].n : null;
        fsize = stack.length >= 1 ? (stack[stack.length - 1].v || 10) : 10;
        const on = nm && fontByName[nm];
        dec = (on && decoders[on]) || null;
        break; }
      case "TL": leading = (stack[stack.length - 1] || {}).v || 0; break;
      case "Td": case "TD": {
        const ty = (stack[stack.length - 1] || {}).v || 0;
        const tx = (stack[stack.length - 2] || {}).v || 0;
        if(o === "TD") leading = -ty;
        setLine(tx, ty);
        break; }
      case "Tm": {
        const f = stack.slice(-6).map(e => (e && e.v) || 0);
        if(f.length === 6){ tm = f.slice(); tlm = f.slice(); }
        break; }
      case "T*": setLine(0, -leading); break;
      case "BT": tm = [1, 0, 0, 1, 0, 0]; tlm = tm.slice(); break;
      case "q": gsStack.push(ctm.slice()); break;
      case "Q": if(gsStack.length) ctm = gsStack.pop(); break;
      case "cm": {
        const f = stack.slice(-6).map(e => (e && e.v) || 0);
        if(f.length === 6) ctm = mul(f, ctm);
        break; }
      case "Tj": { const r = show(strOf(stack[stack.length - 1])); emit(r.txt, r.adv); break; }
      case "'": { setLine(0, -leading); const r = show(strOf(stack[stack.length - 1])); emit(r.txt, r.adv); break; }
      case "\"": { setLine(0, -leading); const r = show(strOf(stack[stack.length - 1])); emit(r.txt, r.adv); break; }
      case "TJ": {
        const a = stack[stack.length - 1];
        if(a && a.arr){
          let line = "", adv = 0;
          a.arr.forEach(e => {
            if(e.s != null){ const r = show(e.s); line += r.txt; adv += r.adv; }
            else if(e.v != null){
              const gap = -e.v / 1000 * fsize;      // real points, not raw units
              adv += gap;
              if(gap > fsize * 0.19 && line && !/\s$/.test(line)) line += " ";
            }
          });
          emit(line, adv);
        }
        break; }
    }
    if(o !== "BT" && o !== "ET" && o !== "q" && o !== "Q") stack.length = 0;
  }
  // Positions are already pushed through the CTM, so they sit in default user
  // space: larger y is higher on the page, which is what the grouping expects.
  return runs;
}

/* Group runs into visual lines, then into cells separated by real column gaps. */
function layoutLines(runs){
  const sorted = runs.slice().sort((a, b) => (b.y - a.y) || (a.x - b.x));
  const lines = [];
  sorted.forEach(r => {
    const L = lines[lines.length - 1];
    if(L && Math.abs(L.y - r.y) <= 3.2){ L.items.push(r); L.y = (L.y + r.y) / 2; }
    else lines.push({ y: r.y, items: [r] });
  });
  lines.forEach(L => {
    L.items.sort((a, b) => a.x - b.x);
    const cells = [];
    L.items.forEach(r => {
      const c = cells[cells.length - 1];
      if(c){
        const gap = r.x - c.end;                       // exact: advances come from font widths
        if(gap < Math.max(12, c.size * 1.5)){
          if(gap > c.size * 0.19 && !/\s$/.test(c.t)) c.t += " ";
          c.t += r.t; c.end = r.end;
          return;
        }
      }
      cells.push({ x: r.x, end: r.end, t: r.t, size: r.size });
    });
    L.cells = cells.map(c => ({ x: c.x, t: c.t.replace(/\s+/g, " ").trim() })).filter(c => c.t);
  });
  return lines.filter(L => L.cells && L.cells.length);
}

/* Pair each label cell with the value sitting beneath it in the same column. */
function pairLabelsToValues(lines){
  const known = new Set();
  Object.keys(SYN).forEach(k => SYN[k].forEach(v => known.add(v)));
  const isLabel = t => /\*\s*$/.test(t) || known.has(NORM(t));
  const out = [];
  const seen = new Set();

  for(let i = 0; i < lines.length; i++){
    for(const c of lines[i].cells){
      if(!isLabel(c.t)) continue;
      const label = c.t.replace(/\*+\s*$/, "").trim();
      const key = NORM(label);
      if(!key || seen.has(key)) continue;                 // first occurrence wins
      for(let j = i + 1; j < Math.min(i + 4, lines.length); j++){
        const aligned = lines[j].cells.filter(v => Math.abs(v.x - c.x) < 42);
        if(!aligned.length) continue;
        if(aligned.some(v => isLabel(v.t))) break;        // next label in this column: field was blank
        out.push(label + ": " + aligned[0].t);
        seen.add(key);
        break;
      }
    }
  }
  return out.join("\n");
}


async function pdfPageText(objs, decoders){
  const pages = Object.keys(objs).filter(n => /\/Type\s*\/Page[^s]/.test(objs[n].dict + " "));
  let all = "";
  const targets = pages.length ? pages : Object.keys(objs).filter(n => objs[n].data && /\/Contents/.test(objs[n].dict));
  for(const pn of targets){
    const pd = objs[pn].dict;
    // font resource names for this page
    const fontByName = {};
    const fr = pd.match(/\/Font\s*<<([\s\S]*?)>>/);
    let fontBlock = fr ? fr[1] : null;
    if(!fontBlock){
      const rr = pd.match(/\/Resources\s+(\d+)\s+\d+\s+R/);
      if(rr && objs[rr[1]]){
        const f2 = objs[rr[1]].dict.match(/\/Font\s*<<([\s\S]*?)>>/);
        if(f2) fontBlock = f2[1];
        else {
          const f3 = objs[rr[1]].dict.match(/\/Font\s+(\d+)\s+\d+\s+R/);
          if(f3 && objs[f3[1]]) fontBlock = objs[f3[1]].dict;
        }
      }
    }
    if(fontBlock){
      const re = /\/([^\s/]+)\s+(\d+)\s+\d+\s+R/g; let m;
      while((m = re.exec(fontBlock))) fontByName[m[1]] = m[2];
    }
    const refs = [];
    const cm = pd.match(/\/Contents\s+(\d+)\s+\d+\s+R/);
    if(cm) refs.push(cm[1]);
    const ca = pd.match(/\/Contents\s*\[([\s\S]*?)\]/);
    if(ca){ const re = /(\d+)\s+\d+\s+R/g; let m; while((m = re.exec(ca[1]))) refs.push(m[1]); }
    let pageRuns = [];
    for(const r of refs){
      const raw = await streamOf(objs[r]);
      if(!raw) continue;
      pageRuns = pageRuns.concat(runsFromContent(L1(raw), fontByName, decoders));
    }
    if(pageRuns.length){
      const lines = layoutLines(pageRuns);
      const paired = pairLabelsToValues(lines);
      all += (paired ? paired + "\n" : "")
           + lines.map(L => L.cells.map(c => c.t).join("\t")).join("\n") + "\n";
    }
  }
  return all;
}

/* ---- entry point ------------------------------------------------------- */
async function readPdfIntake(arrayBuffer){
  const bytes = new Uint8Array(arrayBuffer);
  if(L1(bytes.subarray(0, 5)) !== "%PDF-") throw new Error("That doesn't look like a PDF file.");
  if(typeof DecompressionStream === "undefined")
    throw new Error("This browser can't decompress PDF data. Try Chrome, Edge or Safari, or paste the text instead.");

  const objs = await pdfObjects(bytes);

  // 1. fillable fields
  const fields = acroFields(objs);
  if(fields.length >= 3){
    return { text: fields.map(([t, v]) => `${t}: ${v}`).join("\n"), via: "form fields", count: fields.length };
  }

  // 2. page text
  const decoders = await fontDecoders(objs);
  const text = await pdfPageText(objs, decoders);
  const printable = text.replace(/\s/g, "");
  if(printable.length < 20){
    throw new Error("No readable text found — this PDF looks like a scan or an image. "
      + "Open it, select the text and paste it below instead.");
  }
  return { text: text, via: "page text", count: 0 };
}

/* ---------- downloads ----------
   Two save paths. Opened as a plain file, an anchor click downloads the blob.
   Published as a Claude artifact, pages cannot start downloads themselves, so
   the file is handed over through the platform's save prompt instead
   (claude.use("downloads")) and the viewer confirms it. Resolves true once
   the file has been handed to the browser or accepted by the viewer. */
let dlCap;   // undefined = not asked yet, null = unavailable
async function saveBlob(blob, name){
  if(window.claude && typeof window.claude.use === "function"){
    try{
      if(dlCap === undefined) dlCap = await window.claude.use("downloads");
    }catch(e){ dlCap = null; }
    if(dlCap){
      try{
        await dlCap.save({ filename: name, data: blob });
        return true;
      }catch(e){
        if(e && e.code === "declined"){ toast("Download cancelled"); return false; }
        if(e && e.code === "rate_limited"){ toast("Answer the open download prompt first, then try again", "err"); return false; }
        // any other failure: fall through and attempt a plain download
      }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 800);
  return true;
}
function fileBase(){
  const d = state.data;
  const nm = (d.fullName||"Unnamed").replace(/[\\/:*?"<>|]/g,"").trim();
  const dt = d.startDate ? d.startDate.split("-").reverse().join(".") : "";
  const T = TYPES[state.type];
  return T.file
    ? [d.docRef||"HU", T.file, nm, dt].filter(Boolean).join(" ")
    : [d.docRef||"HU", "Letter of engagement", T.label, nm, dt].filter(Boolean).join(" ");
}
/* In-page confirm. The browser's native confirm() is blocked inside sandboxed
   frames (for example when this page is opened from a shared link), where it
   silently returns false — so buttons would appear to do nothing. */
function askConfirm(title, msg, okLabel, cancelLabel, danger){
  return new Promise(resolve=>{
    const ovl = document.createElement("div");
    ovl.className = "ovl";
    const box = document.createElement("div");
    box.className = "modal";
    box.style.width = "min(430px,100%)";
    const head = document.createElement("div");
    head.className = "modal-h";
    const hb = document.createElement("b"); hb.textContent = title;
    head.appendChild(hb);
    const body = document.createElement("div");
    body.className = "modal-b";
    body.style.cssText = "white-space:pre-line;font-size:13.5px;color:var(--ink-2)";
    body.textContent = msg;
    const foot = document.createElement("div");
    foot.className = "modal-f";
    const sp = document.createElement("span"); sp.className = "sp";
    const bNo = document.createElement("button");
    bNo.type = "button"; bNo.className = "btn btn-sm"; bNo.textContent = cancelLabel;
    const bOk = document.createElement("button");
    bOk.type = "button"; bOk.className = "btn btn-primary btn-sm"; bOk.textContent = okLabel;
    if(danger) bOk.style.cssText = "background:var(--err);border-color:var(--err)";
    const done = v => { document.removeEventListener("keydown", onKey); ovl.remove(); resolve(v); };
    const onKey = e => { if(e.key === "Escape") done(false); };
    bNo.onclick = ()=> done(false);
    bOk.onclick = ()=> done(true);
    ovl.onclick = e => { if(e.target === ovl) done(false); };
    document.addEventListener("keydown", onKey);
    foot.append(sp, bNo, bOk);
    box.append(head, body, foot);
    ovl.appendChild(box);
    document.body.appendChild(ovl);
    bOk.focus();
  });
}
function confirmMissing(){
  const miss = requiredMissing();
  if(!miss.length) return Promise.resolve(true);
  return askConfirm(
    `${miss.length} required field${miss.length>1?"s":""} still blank`,
    `• ${miss.join("\n• ")}\n\nThe blanks will appear in the document as highlighted placeholders.`,
    "Generate anyway", "Go back");
}
async function downloadPDF(){
  if(!(await confirmMissing())) return;
  const uni = unsupportedChars();
  if(uni.length){
    toast(`Using your browser's “Save as PDF” so ${uni.slice(0,4).join(" ")} print correctly`);
    setTimeout(()=>window.print(), 700);
    return;
  }
  try{
    const bytes = renderPDF(buildDoc());
    if(await saveBlob(new Blob([bytes], {type:"application/pdf"}), fileBase() + ".pdf"))
      toast("PDF downloaded", "ok");
  }catch(e){
    console.error(e);
    toast("Falling back to the print dialog — choose \u201cSave as PDF\u201d", "err");
    setTimeout(()=>window.print(), 400);
  }
}
async function downloadWord(){
  if(!(await confirmMissing())) return;
  try{
    const bytes = renderDOCX(buildDoc());
    if(await saveBlob(new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}),

}

/* ---------- submit to admin panel ----------
   Saves the current contract (type + full field data, plus the rendered
   document HTML) to the Health U admin panel, so the admin can view it,
   download it as a PDF, and email it to the employee/contractor —
   without re-running any of this tool's own award-rate/document logic. */
const API_BASE = new URLSearchParams(location.search).get("apiBase") || "";
let submitting = false;
async function submitContract(){
  if(submitting) return;
  if(!(await confirmMissing())) return;
  const token = localStorage.getItem("accessToken");
  if(!token){ toast("Please sign in again", "err"); (window.top||window).location.href = "/signin"; return; }
  submitting = true;
  const btn = $("#btnSubmit");
  const prevHtml = btn.innerHTML;
  btn.disabled = true; btn.textContent = "Submitting…";
  try{
    const documentHtml = renderHTML(buildDoc());
    const res = await fetch(API_BASE + "/api/contracts/create", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({
        contractType: state.type,
        employeeName: state.data.fullName || "",
        employeeEmail: state.data.email || "",
        position: state.data.positionTitle || "",
        startDate: state.data.startDate || "",
        data: { type: state.type, data: state.data },
        documentHtml,
      }),
    });
    const json = await res.json().catch(()=>null);
    if(res.ok && json && json.success){
      toast("Submitted — opening it in the admin panel…", "ok");
      setTimeout(()=>{ (window.top||window).location.href = "/admin/contracts"; }, 900);
    }else{
      toast((json && json.message) || "Could not submit the contract", "err");
      btn.disabled = false; btn.innerHTML = prevHtml;
      submitting = false;
    }
  }catch(e){
    console.error(e);
    toast("Could not reach the server", "err");
    btn.disabled = false; btn.innerHTML = prevHtml;
    submitting = false;
  }
}

      showImportResult(found);
      if(!Object.keys(found).length)
        $("#importHint").textContent = "Text was read but no fields matched — check the text below";
    }catch(err){
      console.error(err);
      $("#importHint").textContent = err.message || "Could not read that file";
      toast(err.message || "Could not read that file", "err");
    }
    zone.classList.remove("busy");
  }
  $("#btnPickPdf").onclick = e=>{ e.stopPropagation(); $("#filePdf").click(); };
  zone.onclick = ()=> $("#filePdf").click();
  $("#filePdf").onchange = e=>{ ingestFile(e.target.files[0]); e.target.value = ""; };
  ["dragenter","dragover"].forEach(ev=> zone.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation(); zone.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev=> zone.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation(); zone.classList.remove("over"); }));
  zone.addEventListener("drop", e=>{
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) ingestFile(f);
  });
  // dropping anywhere on the app opens the importer and ingests
  ["dragover","drop"].forEach(ev=> document.addEventListener(ev, e=>{
    if(ev === "dragover"){ e.preventDefault(); return; }
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f && /\.pdf$/i.test(f.name)){ $("#importModal").hidden = false; ingestFile(f); }
  }));
  $("#btnImportApply").onclick = ()=>{
    if(!pendingImport) return;
    const n = Object.keys(pendingImport).length;
    Object.assign(state.data, pendingImport);
    if(state.data.level && +state.data.payPoint > payPointsFor(state.data.level)) state.data.payPoint = "1";
    $("#importModal").hidden = true;
    $("#importText").value = ""; $("#matchOut").innerHTML = "";
    $("#btnImportApply").disabled = true; pendingImport = null;
    renderForm(); renderPreview();
    toast(`Filled ${n} field${n>1?"s":""} — check them before generating`, "ok");
  };
  document.addEventListener("keydown", e=>{ if(e.key === "Escape") $("#importModal").hidden = true; });

  $("#fileLogo").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        // normalise to JPEG on white so it embeds cleanly in both PDF and Word
        const scale = Math.min(1, 600 / img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", 0.92);
        state.logo = url;
        state.logoW = c.width; state.logoH = c.height;
        state.logoPdf = { kind:"jpeg", b64: url.split(",")[1], w: c.width, h: c.height };
        state.logoIsDefault = false;
        renderForm(); renderPreview(); toast("Logo added", "ok");
      };
      img.onerror = ()=> toast("Could not read that image", "err");
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
    e.target.value = "";
  };
  $("#fileRates").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const j = JSON.parse(rd.result);
        if(!j.weekly) throw new Error("missing weekly rates");
        state.award = Object.assign(JSON.parse(JSON.stringify(AWARD)), j);
        renderRates(); renderPreview(); toast("Rate table imported", "ok");
      }catch(err){ toast("That file isn't a valid rate table", "err"); }
      e.target.value = "";
    };
    rd.readAsText(f);
  };
  document.addEventListener("keydown", e=>{
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); downloadPDF(); }
  });
}
boot();

/* This is an internal staff tool: gate it the same way the admin panel
   itself does (redirect signed-out visitors to sign in, non-admins away)
   before revealing the UI that boot() just built underneath the overlay. */
async function guardAccess(){
  const token = localStorage.getItem("accessToken");
  if(!token){ (window.top||window).location.href = "/signin"; return; }
  try{
    const res = await fetch(API_BASE + "/api/user/get-user-details", {
      credentials: "include",
      headers: { Authorization: "Bearer " + token },
    });
    const json = await res.json().catch(()=>null);
    const role = String((json && json.data && json.data.role) || "").toUpperCase();
    if(!res.ok || !(role === "ADMIN" || role === "OWNER")){
      (window.top||window).location.href = "/";
      return;
    }
  }catch(e){
    (window.top||window).location.href = "/signin";
    return;
  }
  const gate = document.getElementById("authGate");
  if(gate) gate.remove();
}
guardAccess();
</script>
